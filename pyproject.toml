[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-auth"
version = "1.0.0"
description = "Minecraft Java authentication with a Linux Secret Service keyring"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["SecretStorage>=3.3"]

[project.scripts]
minecraft-auth = "minecraft_auth:main"

[tool.setuptools]
py-modules = ["minecraft_auth"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "S101",
  "S105",
  "S603",
  "S607",
]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["minecraft_auth.py", "tests"]
reportMissingTypeStubs = "none"
