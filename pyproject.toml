[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-auth"
version = "1.0.0"
description = "Minecraft Java authentication with a Linux Secret Service keyring"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["SecretStorage>=3.3"]

[project.scripts]
minecraft-auth = "minecraft_auth:main"

[tool.setuptools]
py-modules = ["minecraft_auth"]
