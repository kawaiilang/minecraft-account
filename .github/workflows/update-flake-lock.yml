name: Update flake.lock

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: update-flake-lock-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  update:
    name: Update and verify flake.lock
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      lock_b64: ${{ steps.update.outputs.lock_b64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0

      - name: Update flake.lock
        id: update
        run: |
          nix flake update
          lock_b64=$(base64 -w0 flake.lock)
          echo "lock_b64=$lock_b64" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify updated flake.lock
        if: steps.update.outputs.changed == 'true'
        run: |
          nix flake check --no-update-lock-file --print-build-logs
          nix run --no-update-lock-file . -- --help

  publish:
    name: Create or clean up the lock update PR
    needs: update
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Restore the lock file on the verified base
        env:
          LOCK_B64: ${{ needs.update.outputs.lock_b64 }}
        run: |
          if [[ $(git rev-parse HEAD) != "$GITHUB_SHA" ]]; then
            echo "::error::The default branch moved. Start a new lock update on its current head."
            exit 1
          fi
          if [[ -z "$LOCK_B64" || ${#LOCK_B64} -gt 65536 ]]; then
            echo "::error::Missing or oversized lock file output."
            exit 1
          fi
          lock_file="$RUNNER_TEMP/flake.lock"
          printf '%s' "$LOCK_B64" | base64 --decode > "$lock_file"
          jq --exit-status --slurp '
            length == 1 and (.[0] |
              (.version | type == "number") and
              (.root | type == "string") and
              (.nodes[.root] | type == "object"))
          ' "$lock_file" > /dev/null
          mv -T -- "$lock_file" flake.lock

      - name: Create or clean up pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: chore/update-flake-lock
          add-paths: flake.lock
          delete-branch: true
          commit-message: "chore(nix): update flake.lock"
          title: "chore(nix): update flake.lock"
          body: |
            Automated weekly update of `flake.lock`.

            Verified with `nix flake check --no-update-lock-file` and `nix run --no-update-lock-file . -- --help` prior to opening this PR.
