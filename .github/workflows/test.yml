name: Account tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies and check the command
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-secretstorage python3-venv python3-setuptools python3-wheel gnome-keyring dbus-daemon zenity xvfb xauth
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install --no-index --no-deps --no-build-isolation .
          .venv/bin/minecraft-account --help

      - name: Test authentication and Java launch
        run: |
          export AUTH_MODULE="$(.venv/bin/python -I -c 'import minecraft_account; print(minecraft_account.__file__)')"
          export AUTH_JAVA="$(command -v java)"
          export AUTH_JAVA_PROBE="$PWD/tests/ArgumentProbe.java"
          .venv/bin/python tests/test_auth.py
          xvfb-run -a .venv/bin/python tests/gui.py
          dbus-run-session -- .venv/bin/python tests/keyring.py
